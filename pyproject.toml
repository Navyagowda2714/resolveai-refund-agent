[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "resolveai"
version = "0.1.0"
description = "Customer issues, resolved (safely): an AI agent that investigates, decides and resolves refund requests, and knows when to involve a human."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Navyashree Byregowda" }]
requires-python = ">=3.10"
keywords = ["llm", "agents", "customer-support", "tool-calling", "guardrails", "human-in-the-loop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
resolveai = "resolveai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/resolveai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:.*httpx2.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF012"]
